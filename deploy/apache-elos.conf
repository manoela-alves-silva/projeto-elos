# ELOS em VPS com Apache + PHP (exemplo). Troque elos.seusite.com.br e
# /var/www/projeto-elos pelos seus valores.
# Precisa de: sudo a2enmod rewrite   |   HTTPS: sudo certbot --apache

Listen 127.0.0.1:8000

# SITE (frontend): o único endereço aberto para a internet.
<VirtualHost *:80>
    ServerName elos.seusite.com.br
    DocumentRoot /var/www/projeto-elos/frontend

    <Directory /var/www/projeto-elos/frontend>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

# API (backend): só a própria máquina acessa.
<VirtualHost 127.0.0.1:8000>
    DocumentRoot /var/www/projeto-elos/backend/public

    <Directory /var/www/projeto-elos/backend/public>
        AllowOverride All
        Require local
    </Directory>

    # Variáveis do banco (este arquivo fica só no servidor, nunca no git).
    SetEnv DB_HOST 127.0.0.1
    SetEnv DB_NAME elos_db
    SetEnv DB_USER elos_user
    SetEnv DB_PASSWORD troque-aqui
</VirtualHost>
