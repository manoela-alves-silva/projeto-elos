# ELOS em VPS com Nginx + PHP-FPM (exemplo). Troque elos.seusite.com.br,
# /var/www/projeto-elos e a versão do PHP pelos seus valores.
# HTTPS: depois de ativar, rode  sudo certbot --nginx -d elos.seusite.com.br

# SITE (frontend): o único endereço aberto para a internet.
server {
    listen 80;
    server_name elos.seusite.com.br;
    root /var/www/projeto-elos/frontend;
    index index.php;

    client_max_body_size 12m;

    location ~ /\.            { deny all; }
    location ^~ /src/         { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}

# API (backend): só a própria máquina acessa (127.0.0.1:8000).
server {
    listen 127.0.0.1:8000;
    root /var/www/projeto-elos/backend/public;

    client_max_body_size 12m;

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}

# As variáveis DB_* NÃO vão aqui: ficam no pool do PHP-FPM, por exemplo
# em /etc/php/8.3/fpm/pool.d/www.conf (arquivo só do root):
#   env[DB_HOST] = 127.0.0.1
#   env[DB_NAME] = elos_db
#   env[DB_USER] = elos_user
#   env[DB_PASSWORD] = senha
#   env[ELOS_DEBUG] =
# Depois: sudo systemctl restart php8.3-fpm
